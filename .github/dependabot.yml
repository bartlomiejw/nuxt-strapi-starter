version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', '@nuxtjs/*', 'vue', 'vue-router']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/test', '@vue/test-utils', 'happy-dom']
      lint:
        patterns: ['eslint', '@nuxt/eslint', 'typescript', 'vue-tsc', '@commitlint/*', 'lint-staged', 'husky']
    ignore:
      # PrimeVue 5+ is no longer MIT-licensed (license key required). Stay on 4.x.
      - dependency-name: 'primevue'
        update-types: ['version-update:semver-major']
      - dependency-name: '@primevue/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@primeuix/themes'
        update-types: ['version-update:semver-major']
      # Keep Node type definitions aligned with the Node 22 LTS runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # vue-tsc and typescript-eslint do not support TypeScript 7 yet.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /strapi
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      strapi:
        patterns: ['@strapi/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ['/', '/strapi']
    schedule:
      interval: monthly
    ignore:
      # Move between Node LTS lines deliberately, not to odd-numbered releases.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
